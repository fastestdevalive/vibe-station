name: Desktop Build

on:
  push:
    branches: [main, "feat-tauri-desktop-shell"]
  pull_request:
    branches: [main]

# Only one build per ref at a time; cancel in-progress when a new one starts.
concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node / pnpm ───────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # ── Rust toolchain ────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      # ── Linux system libraries for WebKitGTK ─────────────────────────────
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      # ── Build the daemon binary ───────────────────────────────────────────
      - name: Build TypeScript (daemon)
        run: pnpm --filter cli build

      - name: Build daemon binary
        run: bash scripts/build-daemon-binary.sh --target ${{ matrix.target }}

      - name: Copy daemon binary into Tauri externals dir
        run: |
          mkdir -p desktop/src-tauri/binaries
          cp dist/vst-daemon-${{ matrix.target }} \
             desktop/src-tauri/binaries/vst-daemon-${{ matrix.target }}
          chmod +x desktop/src-tauri/binaries/vst-daemon-${{ matrix.target }}

      # ── Download cloudflared ──────────────────────────────────────────────
      - name: Download cloudflared binary
        run: bash scripts/download-cloudflared.sh --target ${{ matrix.target }}

      # ── Build Tauri app ───────────────────────────────────────────────────
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }}

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload macOS .dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: vibe-station-${{ matrix.target }}.dmg
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Linux .AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vibe-station-${{ matrix.target }}.AppImage
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload Linux .deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vibe-station-${{ matrix.target }}.deb
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
