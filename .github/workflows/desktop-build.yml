name: Desktop Build

on:
  push:
    branches: [main, "feat-tauri-desktop-shell"]
  pull_request:
    branches: [main]

# Least privilege: the dependency build gets a read-only token and no secrets.
permissions:
  contents: read

# Only one build per ref at a time; cancel in-progress when a new one starts.
concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel (x86_64-apple-darwin) deliberately dropped: macos-13 (the
          # old standard Intel runner) was retired by GitHub, and
          # macos-15-large -- the only remaining Intel option -- is a paid
          # "larger runners" tier this org doesn't have enabled. Decided not
          # to carry that dependency for Intel Mac coverage.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # ── Node / pnpm ───────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # ── Rust toolchain ────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch tip)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "desktop/src-tauri -> target"

      # ── Linux system libraries for WebKitGTK ─────────────────────────────
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      # tauri.conf.json's beforeBuildCommand runs scripts/prep-sidecar.sh, which
      # builds the merged vst binary and the claude-acp / codex-acp adapters (the
      # pinned Rust ports, scripts/build-rust-acp.sh — no bun/node needed).

      # ── Build Tauri app ───────────────────────────────────────────────────
      - name: Build Tauri app
        # No GITHUB_TOKEN: without tagName/releaseId tauri-action uploads nothing (needs a live PR run to confirm).
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }}

      - name: Recompress macOS .dmg (lzma)
        if: runner.os == 'macOS'
        run: bash scripts/recompress-dmg.sh desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload macOS .dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vibe-station-${{ matrix.target }}.dmg
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Linux .AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vibe-station-${{ matrix.target }}.AppImage
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload Linux .deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vibe-station-${{ matrix.target }}.deb
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
