name: Rust CI

on:
  push:
    paths: ["rust/**"]
  pull_request:
    paths: ["rust/**"]

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: rust-gate.sh --workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The agy-acp adapter lives in a git submodule (rust/vendor/openab).
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Run the gate
        run: rust/scripts/rust-gate.sh --workspace

      - name: Build + gate agy-acp (walled-garden)
        run: rust/scripts/agy-acp-gate.sh

      - name: cargo deny check (workspace)
        run: cargo deny check --manifest-path rust/Cargo.toml

      - name: cargo deny check licenses (agy-acp)
        run: cargo deny check licenses --manifest-path rust/vendor/openab/agy-acp/Cargo.toml
