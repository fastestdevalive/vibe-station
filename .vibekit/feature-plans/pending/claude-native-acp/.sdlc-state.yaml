current_subfeature: 00-protocol-spike

# ============================================================================
# Context: this feature exists because forking `claude-agent-acp` alone (the
# user's original idea) does NOT eliminate the Node.js dependency for Claude
# support — see arch-claude-native-acp.md for the full investigation. The
# real Node dependency is one layer deeper, in @anthropic-ai/claude-agent-sdk,
# which extracts and drives a 309MB closed-source, precompiled `claude`
# binary (confirmed to be the same `claude` CLI already on PATH) via an
# UNDOCUMENTED stdin/stdout protocol. Phase 00 is a spike with a real
# go/no-go gate, not a foregone conclusion — see its phase brief.
#
# The official `agent-client-protocol` Rust crate (already a dependency,
# confirmed via research subagent to be the same project as
# github.com/agentclientprotocol/rust-sdk) provides real Agent-builder
# scaffolding useful for phase 01's outer shape, but gives zero help with the
# actual hard part (the inner claude-binary protocol) — its own
# `claude_agent()` convenience constructor just shells out to the same
# Node.js package this feature exists to eliminate.
# ============================================================================

model_policy_note: >
  Per user direction (2026-09-16): same DeepSeek/agy-medium dispatch pattern
  as daemon-rust-port, with a flagged caveat — phase 00 is reverse-engineering/
  protocol-archaeology against an undocumented vendor protocol, not
  line-for-line porting of readable source (the shape of work every other
  part of daemon-rust-port was). Consider a stronger model for phase 00
  specifically, or plan for tighter orchestrator review of its findings
  before greenlighting phase 01 — see arch-claude-native-acp.md's risk
  section.

