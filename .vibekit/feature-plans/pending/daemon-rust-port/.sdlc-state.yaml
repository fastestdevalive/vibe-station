    process_note: >
      First real escalation on this feature (step D's ladder, not step G's —
      this was stuck-in-flight, never reached a gate). DeepSeek session
      vs-141-a-4c95a907 correctly diagnosed a genuine architecture gap in the
      04-spike-frozen AcpTransport trait: agent_client_protocol's
      connect_with() runs the whole connection as one closure that only
      returns on connection close, which doesn't naturally fit the trait's
      separately-callable &self methods. It then fell into a hard repeated-
      text loop ("Let me create the stubs... Let me create them.") instead of
      implementing its own correct diagnosis. One steering message with a
      concrete actor-pattern resolution did not unstick it (identical loop
      continued). No commits existed for this part, so nothing was lost by
      escalating — terminated and dispatched fresh on $HAIKU_MODE
      (mode-1789474690627-p55ag) as vs-141-a-df7cdb81.
      That Haiku session made no visible progress before the user (having
      separately noticed the model-swap cost discussion happening in the
      main orchestrator session) directed reverting to DeepSeek instead —
      terminated vs-141-a-df7cdb81 (no commits, nothing lost) and dispatched
      vs-141-a-3c4270a9 on $DEEPSEEK_MODE with the same pre-solved
      actor-pattern resolution in the prompt. Net effect: this part has now
      had 3 dispatch attempts (2 DeepSeek, 1 Haiku) without a commit yet;
      if the current DeepSeek attempt also stalls, that's step G's "3 total
      attempts, mixed models" ceiling — stop dispatching further rounds and
