[package]
name = "vibe-station-desktop"
version = "0.0.4-beta"
description = "vibe-station desktop shell"
authors = ["Gaurav Bhola"]
license = "MIT"
repository = ""
default-run = "vibe-station-desktop"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "vibe-station-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
regex = "1"
dirs-next = "2"
percent-encoding = "2"
url = "2"

[features]
# This feature is used for production builds or when a dev server is not specified,
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# Size-optimised release build (macOS dmg / Linux deb): measured 17.2 MB -> 8.6 MB for the shell.
# The shell is thin glue (rendering happens in the system webview), so speed is not a concern here.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
