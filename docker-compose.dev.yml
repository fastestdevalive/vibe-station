# Dev sandbox: feature branch FE + daemon in isolation.
# Does NOT touch your running vibe-station instance.
#
# Usage (single sandbox, historical/simple case):
#   docker compose -f docker-compose.dev.yml up --build
#   Then open: http://localhost:5174
#
# Usage (multiple worktrees' sandboxes running concurrently):
#   scripts/dev-sandbox.sh up [worktree-name] [port] [--seed=file-search|demo]
#   scripts/dev-sandbox.sh down [worktree-name]
#   See scripts/dev-sandbox.sh — it sets VST_SANDBOX_PORT/DATA_VOLUME/
#   PROJECTS_VOLUME (below) and a `-p <worktree-name>` compose project name so
#   each worktree gets its own port + volumes instead of colliding on the
#   defaults every plain `docker compose ... up` shares.
#
# This sandbox always has hot-reload (web-ui/src bind-mounted) and no login
# (VST_NO_AUTH=1). By default it seeds the realistic 3-project/9-worktree/
# 14-session demo dataset, so there are worktrees/agent sessions to click
# into out of the box — pass `--seed=file-search` (or set
# VST_SEED_MODE=file-search) instead if you specifically want a fast, empty
# single-project tree. If you specifically need to
# reproduce the frozen, single-instance, real-auth screenshot sandbox itself
# (e.g. to regenerate README screenshots), use
# docker-compose.screenshots.yml instead — it bakes source into the image
# (no hot reload) and keeps auth on, which this file intentionally doesn't.
#
# Every agent harness — claude, codex, opencode, cursor-agent, agy, omp, pi (and
# gemini) — is installed IN the image as a pinned Linux build for the image's arch
# (dev.Dockerfile), on Linux and macOS hosts alike. This file mounts no host
# binary: a Mac's are Mach-O (ENOEXEC in this Linux container). On a LINUX host,
# scripts/dev-sandbox.sh layers a generated overlay that bind-mounts the host's own
# opencode/agy/codex/cursor-agent (only those that exist) under /opt/host-bins, and
# scripts/dev-entrypoint.sh prefers them over the image's pinned copies. On macOS
# it layers nothing. CREDENTIALS come from the host, and how depends on where
# each CLI keeps its login:
#
#   claude        macOS keeps the login in the Keychain, so a long-lived token from
#                 `claude setup-token` (CLAUDE_CODE_OAUTH_TOKEN, read by
#                 scripts/dev-sandbox.sh from ~/.config/vibe-station/claude-oauth-token)
#                 is REQUIRED there (`dev-sandbox.sh up` offers to mint and save one
#                 on a TTY); Linux falls back to copying .credentials.json.
#   codex         ~/.codex/auth.json is seeded when codex uses its file store
#                 (`cli_auth_credentials_store`); with a keyring store there's no
#                 file, so `codex login --device-auth` inside (or --with-api-key).
#   opencode      ~/.local/share/opencode/auth.json (a file on every OS) is seeded,
#                 or `opencode auth login` inside.
#   cursor-agent  Linux: ~/.config/cursor/auth.json is seeded. macOS: Keychain, so
#                 `cursor-agent login` inside (NO_OPEN_BROWSER is set — it prints the
#                 URL), or export CURSOR_API_KEY before `up` (passed through below).
#   agy           macOS: Keychain, so sign in inside (agy prints a URL, you paste
#                 the code back). On Linux the login is ALSO in-sandbox: the
#                 container has no Secret Service, see scripts/dev-entrypoint.sh.
#   omp, pi       ~/.omp/agent and ~/.pi/agent (plain files on every OS) are seeded.
#
# Logins made INSIDE the sandbox (codex/opencode/cursor-agent/agy) are kept in
# this worktree's data volume (scripts/dev-entrypoint.sh's `seed_persistent_home`),
# so they survive the `--force-recreate` every `scripts/dev-sandbox.sh up` does; a
# credential the host DOES have on disk is still re-copied on top at every start.
#
# Real credentials are piped in via read-only "seed" mounts under /seed/*, copied
# by scripts/dev-entrypoint.sh into a writable location inside the container — see
# that script for exactly what's copied vs. excluded per CLI, and why: each CLI's
# credential lives in a different, specific file/dir, usually alongside gigabytes
# of unrelated local history/db state that a throwaway sandbox has no use for.
# `VST_NO_AUTH` above is the DAEMON's own login, unrelated to these — these are
# the underlying agent CLIs' auth. The sandbox never reads the macOS Keychain.
#
# To inspect a running sandbox interactively, use
# `docker compose exec -u vst vst-dev bash` (or `docker exec -u vst
# <container> sh`) — NOT a plain `docker exec`/`docker compose exec`. The
# container's own process runs as root (so its startup script can chown
# volumes before dropping to "vst"), so a plain exec lands as uid 0, whose
# tmux socket dir (`/tmp/tmux-0/`) differs from the daemon's
# (`/tmp/tmux-1000/`), so `tmux attach`/`tmux ls` won't see the daemon's
# actual sessions without `-u vst`.

services:
  vst-dev:
    build:
      context: .
      dockerfile: dev.Dockerfile
    ports:
      # Host port → container 5173 (Vite dev server). Override via
      # VST_SANDBOX_PORT (see scripts/dev-sandbox.sh) so concurrent
      # worktree sandboxes don't fight over the same host port; defaults to
      # 5174 to match this file's original single-sandbox behavior.
      - "${VST_SANDBOX_PORT:-5174}:5173"
    environment:
      HOME: /home/vst
      # Vite proxy already points to 127.0.0.1:7421 — no change needed
      # Dev sandbox: disable daemon auth (no login screen) and let Vite accept
      # any Host header so Tailscale / LAN access works. Sandbox-only — do not
      # mirror these onto a network-exposed production daemon.
      # Requires the daemon binary to be compiled with `insecure-no-auth` (scripts/dev-sandbox.sh
      # builds this automatically). VST_NO_AUTH_BIND_ALL allows 0.0.0.0 binding inside the container.
      VST_NO_AUTH: "1"
      # omp's models.yml names custom-provider keys by env var (e.g. a local vLLM
      # provider with `apiKey: DEEPSEEK_LOCAL_API_KEY`). Placeholder so such a
      # provider works in the sandbox; export your own value to override.
      DEEPSEEK_LOCAL_API_KEY: "${DEEPSEEK_LOCAL_API_KEY:-none}"
      VST_NO_AUTH_BIND_ALL: "1"
      VITE_DEV_ALLOW_ALL_HOSTS: "1"
      # Forward host GITHUB_TOKEN into the sandbox so the daemon's PR status
      # feature can pick it up. The `:-` default makes it optional — unset on
      # host → empty string in container → env_generic_token() returns None.
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      # Point cloudflared at Vite (port 5173) so mobile gets the full SPA
      # through the tunnel. Vite proxies /mobile-auth and /api/* back to the
      # daemon. Unset in production (daemon serves SPA directly on its own port).
      VST_TUNNEL_PORT: "5173"
      # Point the Rust daemon at the built SPA for static serving (the Node
      # daemon resolves web-ui/dist itself from the image; the Rust daemon
      # resolves `dist` relative to its own mounted binary, so it needs the
      # absolute path). The Vite dev server serves the browser, so a missing
      # dist is fine — the Rust daemon 404s the fallback route harmlessly.
      VST_DIST_PATH: "/app/web-ui/dist"
      # "demo" (default) seeds the same realistic 3-project/9-worktree/
      # 14-session dataset docker-compose.screenshots.yml uses, so every
      # sandbox has actual worktrees/agents to test against; "file-search"
      # seeds one lightweight project instead. Override via
      # `scripts/dev-sandbox.sh up --seed=file-search` — see
      # scripts/dev-entrypoint.sh for the branch.
      VST_SEED_MODE: "${VST_SEED_MODE:-demo}"
      # Long-lived claude auth token (`claude setup-token` on the host) —
      # scripts/dev-sandbox.sh reads it from ~/.config/vibe-station/claude-oauth-token
      # when not already in the environment. Without it the sandbox falls back
      # to a copied .credentials.json snapshot that breaks at the next token
      # rotation — see the claude block in scripts/dev-entrypoint.sh.
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
      # cursor-agent's documented headless auth (an API key from the Cursor
      # dashboard). No value = passed through only when set on the host, and left
      # UNSET (not empty) in the container otherwise. NO_OPEN_BROWSER makes
      # `cursor-agent login` print its URL instead of trying to open a browser.
      CURSOR_API_KEY:
      NO_OPEN_BROWSER: "1"
    volumes:
      # Agent CLI binaries: none are mounted here — every harness is installed
      # INSIDE the image (dev.Dockerfile); on Linux hosts only, scripts/dev-sandbox.sh
      # adds the host's own installs via a generated overlay. The mounts below are
      # credentials/config only.
      # Gemini/agy creds/config: mount host ~/.gemini READ-ONLY as a seed. The
      # entrypoint copies it into a WRITABLE /home/vst/.gemini that lives in the
      # data volume (`seed_persistent_home`) — agy (antigravity-cli) writes logs/
      # cache/conversations under ~/.gemini/antigravity-cli and fails hard on a
      # read-only mount, and an in-sandbox agy sign-in must survive a recreate.
      # The bulky `antigravity` and `antigravity-browser-profile` dirs (~1.9G, the
      # desktop IDE + its browser profile) are skipped — agy-cli needs neither.
      - ${HOME}/.gemini:/seed/gemini:ro
      # claude creds: `.credentials.json` (the OAuth token) lives directly
      # under `~/.claude`, alongside gigabytes of past-conversation
      # transcripts (`projects/`) the entrypoint excludes from the copy (see
      # `seed_writable_home` there). `~/.claude.json` is a SEPARATE sibling
      # file (onboarding/telemetry state claude checks on startup), seeded
      # independently since it isn't inside `~/.claude` itself.
      - ${CLAUDE_HOME:-${HOME}/.claude}:/seed/claude:ro
      - ${CLAUDE_JSON:-${HOME}/.claude.json}:/seed/claude.json:ro
      # cursor creds: verified empirically that the real OAuth access/refresh
      # tokens live under `~/.config/cursor/auth.json`, NOT `~/.cursor`
      # (which holds CLI session/workspace state — chats, per-project
      # transcripts, extensions — excluded by the entrypoint as bulk/
      # non-auth). Both are mounted since cursor-agent also reads small
      # preference files (`cli-config.json` etc) out of `~/.cursor`.
      - ${CURSOR_CONFIG_HOME:-${HOME}/.config/cursor}:/seed/cursor-config:ro
      - ${CURSOR_HOME:-${HOME}/.cursor}:/seed/cursor-home:ro
      # opencode creds: `~/.local/share/opencode/auth.json` is the actual
      # credential; that same directory also holds `opencode.db` (the CLI's
      # global session/transcript store, routinely 500MB-1GB+) which the
      # entrypoint excludes. `~/.config/opencode` (small) carries opencode's
      # own config/skills and is mounted in full.
      - ${OPENCODE_DATA_HOME:-${HOME}/.local/share/opencode}:/seed/opencode-data:ro
      - ${OPENCODE_CONFIG_HOME:-${HOME}/.config/opencode}:/seed/opencode-config:ro
      # codex creds: `~/.codex/auth.json` holds the API key (OPENAI_API_KEY +
      # tokens) codex needs to start. `~/.codex/config.toml` holds TUI prefs.
      # Bulk runtime state (sessions/, sqlite DBs, cache/, tmp/, packages/,
      # plugins/) is excluded — the sandbox doesn't need conversation history.
      - ${CODEX_HOME:-${HOME}/.codex}:/seed/codex:ro
      # pi creds/config (~/.pi/agent/{auth,models,settings}.json) so `pi --list-models` works.
      - ${PI_AGENT_HOME:-${HOME}/.pi/agent}:/seed/pi-agent:ro
      # omp (oh-my-pi) creds/config: ~/.omp/agent holds agent.db (provider
      # credentials), models.yml (custom providers, e.g. a local vLLM), config.yml
      # and models.db. Bulk state (sessions/, cache/, ...) is excluded by the entrypoint.
      # omp itself is installed IN the image (dev.Dockerfile) — never mounted.
      - ${OMP_AGENT_HOME:-${HOME}/.omp/agent}:/seed/omp-agent:ro
      # Rust daemon/CLI binaries. Mount the host's pre-built DEBUG binaries
      # read-only (scripts/dev-sandbox.sh builds `cargo build -p vst-daemon -p
      # vst-cli`, deliberately without `--release` — this is a dev sandbox for
      # iteration speed, and `--release`'s optimization passes dominate Rust
      # rebuild time; see the comment in dev-sandbox.sh above its `docker run`
      # build step for the full reasoning, and the glibc-mismatch warning
      # there for why these must be built inside a bookworm container, never
      # on the host, regardless of debug/release). NOT `pnpm build:rust`,
      # which only builds `-p vst-cli` (the merged binary) since
      # cli-daemon-unification's binary merge (Part 00); it never produces a
      # standalone `vst-daemon` binary, which this sandbox still needs at
      # /usr/local/bin/vst-daemon-rust.
      # Override the paths with VST_RUST_DAEMON_BIN / VST_RUST_CLI_BIN if
      # yours differ (e.g. to test an actual release build). The default
      # points at target-docker/debug (the bookworm-container build output),
      # NOT rust/target/debug — a bare host `cargo build`/`cargo test` run
      # populates rust/target/debug too, and defaulting there would silently
      # reintroduce the host-glibc mismatch this whole container-build
      # mechanism exists to avoid (see scripts/dev-sandbox.sh's comment above
      # its `docker run` build step) the moment that path happens to exist.
      - ${VST_RUST_DAEMON_BIN:-./rust/target-docker/debug/vst-daemon}:/usr/local/bin/vst-daemon-rust:ro
      - ${VST_RUST_CLI_BIN:-./rust/target-docker/debug/vst}:/usr/local/bin/vst-rust:ro

      # Hot-reload: mount web source so Vite picks up changes instantly
      # (daemon changes still require a rebuild — see below)
      - ./web-ui/src:/app/web-ui/src:ro
      - ./web-ui/public:/app/web-ui/public:ro

      # Persist daemon state across container restarts (modes.json, projects, etc.)
      # Remove this volume to start completely fresh: docker volume rm vst-dev-data
      - vst-dev-data:/home/vst/.vibe-station

      # Persist seeded source repos so their .git/ dirs survive rebuilds.
      # Without this, /home/vst/projects/ is wiped on `up --build`, which
      # orphans the worktree checkouts in vst-dev-data (their `.git` pointer
      # files reference `.git/worktrees/<id>` metadata that no longer exists).
      - vst-dev-projects:/home/vst/projects

    # Just invokes the same shared startup script the image's own CMD uses
    # (scripts/dev-entrypoint.sh) — kept as an explicit override (rather
    # than relying on the image default) so it's obvious this compose file
    # intentionally runs it, and so a future divergence has to be made
    # explicitly here instead of silently falling out of sync.
    command: ["/app/scripts/dev-entrypoint.sh"]
    stdin_open: true
    tty: true

volumes:
  # Explicit `name:`, overridable via VST_SANDBOX_DATA_VOLUME /
  # VST_SANDBOX_PROJECTS_VOLUME — defaults preserve this file's original
  # single-shared-sandbox behavior (every plain `docker compose ... up`
  # mounts the same two volumes), but scripts/dev-sandbox.sh sets these
  # per-worktree so concurrent sandboxes don't clobber each other's daemon
  # state (see the "dev-sandbox-volumes-are-shared" memory note — this is
  # the fix for the "known, intentionally-not-fixed-here limitation" that
  # note originally described).
  #
  # Aside: a colleague still running an OLDER (pre-non-root-daemon) image
  # against a volume you also use will write root-owned files into it; the
  # new non-root daemon then can't read them until the next start re-runs
  # the unconditional chown in scripts/dev-entrypoint.sh.
  vst-dev-data:
    name: ${VST_SANDBOX_DATA_VOLUME:-vst-dev-data}
  vst-dev-projects:
    name: ${VST_SANDBOX_PROJECTS_VOLUME:-vst-dev-projects}
