# Dev sandbox: feature branch FE + daemon in isolation.
# Does NOT touch your running vibe-station instance.
#
# Usage (single sandbox, historical/simple case):
#   docker compose -f docker-compose.dev.yml up --build
#   Then open: http://localhost:5174
#
# Usage (multiple worktrees' sandboxes running concurrently):
#   scripts/dev-sandbox.sh up [worktree-name] [port] [--seed=file-search|demo]
#   scripts/dev-sandbox.sh down [worktree-name]
#   See scripts/dev-sandbox.sh — it sets VST_SANDBOX_PORT/DATA_VOLUME/
#   PROJECTS_VOLUME (below) and a `-p <worktree-name>` compose project name so
#   each worktree gets its own port + volumes instead of colliding on the
#   defaults every plain `docker compose ... up` shares.
#
# This sandbox always has hot-reload (web-ui/src bind-mounted) and no login
# (VST_NO_AUTH=1). By default it seeds the realistic 3-project/9-worktree/
# 14-session demo dataset, so there are worktrees/agent sessions to click
# into out of the box — pass `--seed=file-search` (or set
# VST_SEED_MODE=file-search) instead if you specifically want a fast, empty
# single-project tree. If you specifically need to
# reproduce the frozen, single-instance, real-auth screenshot sandbox itself
# (e.g. to regenerate README screenshots), use
# docker-compose.screenshots.yml instead — it bakes source into the image
# (no hot reload) and keeps auth on, which this file intentionally doesn't.
#
# CLI binaries are bind-mounted read-only from the host so that
# GET /cli-models works inside the container. gemini is installed directly in the image;
# ~/.gemini is bind-mounted so OAuth credentials are available inside the container.
# Override paths with OPENCODE_BIN, CURSOR_AGENT_VERSIONS, CLAUDE_BIN, AGY_BIN if yours differ.
#
# Real credentials for claude/cursor/opencode/agy are piped in too (read-only
# "seed" mounts under /seed/*, copied by scripts/dev-entrypoint.sh into a
# writable location inside the container — see that script's
# `seed_writable_home` calls for exactly what's copied vs. excluded per CLI,
# and why: each CLI's credential lives in a different, specific file/dir,
# usually alongside gigabytes of unrelated local history/db state that a
# throwaway sandbox has no use for). `VST_NO_AUTH` above is the DAEMON's own
# login, unrelated to these — these are the underlying agent CLIs' auth.
#
# To inspect a running sandbox interactively, use
# `docker compose exec -u vst vst-dev bash` (or `docker exec -u vst
# <container> sh`) — NOT a plain `docker exec`/`docker compose exec`. The
# container's own process runs as root (so its startup script can chown
# volumes before dropping to "vst"), so a plain exec lands as uid 0, whose
# tmux socket dir (`/tmp/tmux-0/`) differs from the daemon's
# (`/tmp/tmux-1000/`), so `tmux attach`/`tmux ls` won't see the daemon's
# actual sessions without `-u vst`.

services:
  vst-dev:
    build:
      context: .
      dockerfile: dev.Dockerfile
    ports:
      # Host port → container 5173 (Vite dev server). Override via
      # VST_SANDBOX_PORT (see scripts/dev-sandbox.sh) so concurrent
      # worktree sandboxes don't fight over the same host port; defaults to
      # 5174 to match this file's original single-sandbox behavior.
      - "${VST_SANDBOX_PORT:-5174}:5173"
    environment:
      HOME: /home/vst
      # Vite proxy already points to 127.0.0.1:7421 — no change needed
      # Dev sandbox: disable daemon auth (no login screen) and let Vite accept
      # any Host header so Tailscale / LAN access works. Sandbox-only — do not
      # mirror these onto a network-exposed production daemon.
      VST_NO_AUTH: "1"
      VITE_DEV_ALLOW_ALL_HOSTS: "1"
      # "demo" (default) seeds the same realistic 3-project/9-worktree/
      # 14-session dataset docker-compose.screenshots.yml uses, so every
      # sandbox has actual worktrees/agents to test against; "file-search"
      # seeds one lightweight project instead. Override via
      # `scripts/dev-sandbox.sh up --seed=file-search` — see
      # scripts/dev-entrypoint.sh for the branch.
      VST_SEED_MODE: "${VST_SEED_MODE:-demo}"
    volumes:
      # Mount CLI binaries read-only so the daemon can shell out to them.
      # Paths use $HOME — override with OPENCODE_BIN, CURSOR_AGENT_VERSIONS, CLAUDE_BIN, AGY_BIN if yours differ.
      - ${OPENCODE_BIN:-${HOME}/.opencode/bin/opencode}:/usr/local/bin/opencode:ro
      - ${CLAUDE_BIN:-${HOME}/.local/bin/claude}:/usr/local/bin/claude:ro
      - ${AGY_BIN:-${HOME}/.local/bin/agy}:/usr/local/bin/agy:ro
      # cursor-agent is NOT a single-file mount like the others — its own
      # launcher script does `realpath "$0"` and expects a bundled `node`
      # binary + numbered chunk `.js` files to sit in the SAME directory as
      # itself. Docker resolves a host symlink to its target's CONTENTS at
      # single-file-mount time (verified: `docker run -v host-symlink:...`
      # produces a plain regular file in the container, not a working
      # symlink pointing anywhere), so a single-file mount of just the
      # launcher silently loses those sibling files — the container-side
      # symptom is `Error: Cannot find module '.../index.js'`. Mount the
      # WHOLE `versions/` directory (every installed version, not just the
      # current one — cheap for a read-only bind mount, and avoids needing
      # this compose file to know which version is "current") and let
      # scripts/dev-entrypoint.sh symlink the newest one into
      # /usr/local/bin/cursor-agent from inside the container, where the
      # sibling files are actually reachable.
      - ${CURSOR_AGENT_VERSIONS:-${HOME}/.local/share/cursor-agent/versions}:/opt/cursor-agent-versions:ro
      # Gemini/agy creds: mount host ~/.gemini READ-ONLY as a seed. The container
      # entrypoint (see `command:` below) copies it into a WRITABLE /home/vst/.gemini
      # on startup — agy (antigravity-cli) writes logs/cache/conversations under
      # ~/.gemini/antigravity-cli and fails hard on a read-only mount. The bulky
      # `antigravity` and `antigravity-browser-profile` dirs (~1.9G, the desktop
      # IDE + its browser profile) are skipped during the copy — agy-cli needs
      # neither. Refreshed host OAuth tokens re-propagate only on container
      # recreate (the copy is guarded by a `.seeded` marker), not on restart.
      - ${HOME}/.gemini:/seed/gemini:ro
      # claude creds: `.credentials.json` (the OAuth token) lives directly
      # under `~/.claude`, alongside gigabytes of past-conversation
      # transcripts (`projects/`) the entrypoint excludes from the copy (see
      # `seed_writable_home` there). `~/.claude.json` is a SEPARATE sibling
      # file (onboarding/telemetry state claude checks on startup), seeded
      # independently since it isn't inside `~/.claude` itself.
      - ${CLAUDE_HOME:-${HOME}/.claude}:/seed/claude:ro
      - ${CLAUDE_JSON:-${HOME}/.claude.json}:/seed/claude.json:ro
      # cursor creds: verified empirically that the real OAuth access/refresh
      # tokens live under `~/.config/cursor/auth.json`, NOT `~/.cursor`
      # (which holds CLI session/workspace state — chats, per-project
      # transcripts, extensions — excluded by the entrypoint as bulk/
      # non-auth). Both are mounted since cursor-agent also reads small
      # preference files (`cli-config.json` etc) out of `~/.cursor`.
      - ${CURSOR_CONFIG_HOME:-${HOME}/.config/cursor}:/seed/cursor-config:ro
      - ${CURSOR_HOME:-${HOME}/.cursor}:/seed/cursor-home:ro
      # opencode creds: `~/.local/share/opencode/auth.json` is the actual
      # credential; that same directory also holds `opencode.db` (the CLI's
      # global session/transcript store, routinely 500MB-1GB+) which the
      # entrypoint excludes. `~/.config/opencode` (small) carries opencode's
      # own config/skills and is mounted in full.
      - ${OPENCODE_DATA_HOME:-${HOME}/.local/share/opencode}:/seed/opencode-data:ro
      - ${OPENCODE_CONFIG_HOME:-${HOME}/.config/opencode}:/seed/opencode-config:ro

      # Hot-reload: mount web source so Vite picks up changes instantly
      # (daemon changes still require a rebuild — see below)
      - ./web-ui/src:/app/web-ui/src:ro
      - ./web-ui/public:/app/web-ui/public:ro

      # Persist daemon state across container restarts (modes.json, projects, etc.)
      # Remove this volume to start completely fresh: docker volume rm vst-dev-data
      - vst-dev-data:/home/vst/.vibe-station

      # Persist seeded source repos so their .git/ dirs survive rebuilds.
      # Without this, /home/vst/projects/ is wiped on `up --build`, which
      # orphans the worktree checkouts in vst-dev-data (their `.git` pointer
      # files reference `.git/worktrees/<id>` metadata that no longer exists).
      - vst-dev-projects:/home/vst/projects

    # Just invokes the same shared startup script the image's own CMD uses
    # (scripts/dev-entrypoint.sh) — kept as an explicit override (rather
    # than relying on the image default) so it's obvious this compose file
    # intentionally runs it, and so a future divergence has to be made
    # explicitly here instead of silently falling out of sync.
    command: ["/app/scripts/dev-entrypoint.sh"]
    stdin_open: true
    tty: true

volumes:
  # Explicit `name:`, overridable via VST_SANDBOX_DATA_VOLUME /
  # VST_SANDBOX_PROJECTS_VOLUME — defaults preserve this file's original
  # single-shared-sandbox behavior (every plain `docker compose ... up`
  # mounts the same two volumes), but scripts/dev-sandbox.sh sets these
  # per-worktree so concurrent sandboxes don't clobber each other's daemon
  # state (see the "dev-sandbox-volumes-are-shared" memory note — this is
  # the fix for the "known, intentionally-not-fixed-here limitation" that
  # note originally described).
  #
  # Aside: a colleague still running an OLDER (pre-non-root-daemon) image
  # against a volume you also use will write root-owned files into it; the
  # new non-root daemon then can't read them until the next start re-runs
  # the unconditional chown in scripts/dev-entrypoint.sh.
  vst-dev-data:
    name: ${VST_SANDBOX_DATA_VOLUME:-vst-dev-data}
  vst-dev-projects:
    name: ${VST_SANDBOX_PROJECTS_VOLUME:-vst-dev-projects}
