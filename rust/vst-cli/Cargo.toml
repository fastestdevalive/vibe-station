[package]
name = "vst-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "vst_cli"
path = "src/lib.rs"

[[bin]]
name = "vst"
path = "src/main.rs"

[dependencies]
vst-types = { workspace = true }
vst-daemon = { workspace = true }
vst-proc = { workspace = true }
vst-agy-acp = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

[features]
embed-ui = ["vst-daemon/embed-ui"]
insecure-no-auth = ["vst-daemon/insecure-no-auth"]

[dev-dependencies]
axum = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }

[lints]
workspace = true
