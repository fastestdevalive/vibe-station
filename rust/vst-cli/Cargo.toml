[package]
name = "vst-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "vst_cli"
path = "src/lib.rs"

[[bin]]
name = "vst"
path = "src/main.rs"

[dependencies]
vst-types = { workspace = true }
vst-agents = { workspace = true }
vst-daemon = { workspace = true }
vst-lifecycle = { workspace = true }
vst-proc = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

[features]
embed-ui = ["vst-daemon/embed-ui"]
insecure-no-auth = ["vst-daemon/insecure-no-auth"]

[dev-dependencies]
vst-testkit = { workspace = true }
# TEST ONLY: see vst-daemon's `test-seams` feature.
vst-daemon = { workspace = true, features = ["test-seams"] }
axum = { workspace = true }
tempfile = "3"
flate2 = "1"
tar = { version = "0.4", default-features = false }
ring = "0.17"
base64 = "0.22"
vst-routes = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }

[lints]
workspace = true
