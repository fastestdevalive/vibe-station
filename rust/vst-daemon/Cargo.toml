[package]
name = "vst-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "vst-daemon"
path = "src/main.rs"

[dependencies]
vst-types = { workspace = true }
vst-store = { workspace = true }
vst-proc = { workspace = true }
vst-git = { workspace = true }
vst-rpc = { workspace = true }
vst-agents = { workspace = true }
vst-lifecycle = { workspace = true }
vst-ws = { workspace = true }
vst-routes = { workspace = true }
vst-lsp = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full", "signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true, features = ["ws", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = "0.3"
regex = "1"
ring = "0.17"
percent-encoding = { workspace = true }
rust-embed = { version = "8", optional = true }

[features]
# Embeds web-ui/dist and skill/SKILL.md into the binary at compile time, so a
# curl-only daemon (no Tauri, no bundled resources) can serve the web UI and
# install SKILL.md from itself. Off by default because `web-ui/dist` is
# gitignored and does not exist in every build context that compiles this
# crate (CI lint/test, scripts/dev-sandbox.sh's and Dockerfile.screenshots's
# Docker builds, which only copy rust/ and never run `pnpm build` first) —
# turning this on unconditionally would break all of those. Only
# scripts/prep-sidecar.sh (release/Tauri builds) and the release CI publishing
# vst-<triple>.tar.gz enable it, after ensuring web-ui/dist actually exists.
# See .vibekit/feature-plans/wip/cli-daemon-unification/00-binary-merge/
# plan-00-cli-daemon-unification-binary-merge.md, Key Decisions 3-4.
embed-ui = ["dep:rust-embed"]
# Compile-time opt-in to allow VST_NO_AUTH=1 to disable daemon authentication.
# Must never be enabled for release builds. Off by default.
insecure-no-auth = []

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.24"

[lints]
workspace = true
