[package]
name = "vst-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "vst-daemon"
path = "src/main.rs"

[dependencies]
vst-types = { workspace = true }
vst-store = { workspace = true }
vst-proc = { workspace = true }
vst-git = { workspace = true }
vst-rpc = { workspace = true }
vst-agents = { workspace = true }
vst-agy-acp = { workspace = true }
vst-lifecycle = { workspace = true }
vst-ws = { workspace = true }
vst-routes = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full", "signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true, features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = "0.3"
regex = "1"
ring = "0.17"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
