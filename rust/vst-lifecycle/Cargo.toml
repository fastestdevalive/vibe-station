[package]
name = "vst-lifecycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
vst-types = { workspace = true }
vst-store = { workspace = true }
vst-git = { workspace = true }
vst-proc = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# First outbound-HTTPS dep in the workspace — crate-local, not workspace table.
# rustls-tls avoids native OpenSSL linking issues in CI/sandboxes.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha1 = "0.10"
regex = "1"

[dev-dependencies]
trybuild = "1"
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
tempfile = "3"

[lints]
workspace = true
