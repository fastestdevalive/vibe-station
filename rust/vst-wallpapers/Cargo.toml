[package]
name = "vst-wallpapers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
vst-types = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Same crate-local HTTP client shape as `vst-daemon`/`vst-lifecycle`: rustls-tls
# avoids native OpenSSL linking in CI/sandboxes. No `json` — image bytes only.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ring = "0.17"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "sync", "test-util"] }
tempfile = "3"
axum = { workspace = true }

[lints]
workspace = true
