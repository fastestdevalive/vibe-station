# The ONE place vibe-station records which Rust ACP adapter build it ships. Read by
# scripts/build-rust-acp.sh (awk — keep it flat: [section] + `key = "value"` lines only).
#
# The ports are private repos, so the build DOWNLOADS the prebuilt binary from `release` and
# verifies it against `sha256.<target>` (no credentials needed). A target with no sha256 line has
# no prebuilt; build it with `scripts/build-rust-acp.sh <name> --from-source` (needs the port repo).
#
# Bump procedure: land the change in the port repo (main), build all targets from that rev with
# `--from-source` and publish them as a release of the binaries repo tagged `<name>-acp-<short rev>`
# (assets `<name>-acp-<target>.tar.gz` + `<name>.SHA256SUMS`), then here change `rev`, `release`, every
# `sha256.<target>` (copy from that release's `<name>.SHA256SUMS`) and `upstream` if the mirrored level moved.
# Run `scripts/build-rust-acp.sh <name>` (it asserts the binary reports `+upstream.<upstream>`) and
# re-run the parity harness (scripts/parity/) before committing.
#
# `rev` is the port commit the prebuilt was built from. `upstream` is asserted against the binary's
# `--version`; it is never trusted on its own, so it can't drift from the port's own UPSTREAM_VERSION.
#
# `profile` (optional, --from-source only): space-separated key=value cargo release-profile overrides
# applied as CARGO_PROFILE_RELEASE_<KEY> env vars, so a port whose own profile is not size-tuned can be
# shrunk without editing it (claude: 17.6 MB -> 6.5 MB). `panic` is deliberately left at the port's
# `unwind` (the adapter turns a panicking session into an error reply). The published prebuilts were
# built with it; a prebuilt's size is what ships, so keep it applied whenever one is cut.

[claude]
repo     = "git@github.com:fastestdevalive/claude-agent-acp.git"
rev      = "f58fc63c1fa50e6b1c25a35e4e1d094718e4a7d3"
release  = "https://github.com/fastestdevalive/vibe-station-acp-binaries/releases/download/claude-acp-f58fc63"
manifest = "rust/Cargo.toml"
package  = "claude-agent-acp-rs"
bin      = "claude-agent-acp-rs"
upstream = "0.94.0"
profile  = "opt-level=s lto=true strip=true codegen-units=1"
sha256.aarch64-apple-darwin = "de1c325563150c6643ad9c5248c71dd880f8808231f5cd64bca3f66ee2896394"
sha256.aarch64-unknown-linux-gnu = "bf58936664991baf7e461f7cbaa043b4003f512f60f8b8b1d2aabd3b5775e46c"
sha256.aarch64-unknown-linux-musl = "f9fe17890340132778460bd6a6e84f2b376c5072a628ec4e81535d00d6d96722"
sha256.x86_64-unknown-linux-gnu = "2a8bac8385ea07bf48880da318e83a211124f7d9d501d107fde4efbe892d1bc3"
sha256.x86_64-unknown-linux-musl = "7ad37c1f1710826a91adac3a59c18d731c95efd05148fe0848d8e4a66db89f7f"

